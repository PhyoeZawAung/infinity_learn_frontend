<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Password Reset</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-box {
            max-width: 400px;
            margin: auto;
            margin-top: 80px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 75%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="container">
    <div id="loginPage" class="container-box">
        <h3 class="text-center mb-3">Login</h3>
        <form onsubmit="return loginUser()">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3 password-wrapper">
                <label for="password" class="form-label">Password</label>
                <input type="text" class="form-control" id="password" required>
                <span class="toggle-password" onclick="togglePassword()">
                  <i class="fa fa-eye p-3"  id="eyeIcon"></i>
                </span>
            </div>

           
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div class="text-center mt-3">
                <a href="#" onclick="showForgotPassword()" class="text-decoration-none">Forgot Password?</a> | 
                <a href="guestSignUp.html" class="text-decoration-none">Sign Up</a>
            </div>
        </form>
    </div>

    <!-- FORGOT PASSWORD PAGE -->
    <div id="forgotPasswordPage" class="container-box" style="display: none;">
        <h3 class="text-center mb-3">Forgot Password</h3>
        <form onsubmit="return sendVerificationCode()">
            <div class="mb-3">
                <label for="resetEmail" class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" id="resetEmail" required>
            </div>
            <div class="mb-3">
                <label class="form-label" placeholder="Enter your verificationCode"> Code</label>
                
                <input type="text" class="form-control mt-2" placeholder="Enter Code" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send Code</button>
            <div class="text-center mt-3">
                <a href="#" onclick="showLoginPage()" class="text-decoration-none">Back to Login</a>
            </div>
        </form>
    </div>

    <!-- RESET PASSWORD PAGE -->
    <div id="resetPasswordPage" class="container-box" style="display: none;">
        <h3 class="text-center mb-3">Reset Password</h3>
        <form onsubmit="return resetPassword()">
            <div class="mb-3">
                <label for="resetCode" class="form-label">Verification Code</label>
                <input type="text" class="form-control" id="resetCode" required>
            </div>
            <div class="mb-3 password-wrapper">
                <label for="password" class="form-label">Password</label>
                <input type="text" class="form-control" id="password1" required>
                <span class="toggle-password" onclick="togglePassword()">
                  <i class="fa fa-eye p-3"  id="eyeIcon"></i>
                </span>
            </div>
            <div class="mb-3 password-wrapper">
                <label for="password" class="form-label">confirmPassword</label>
                <input type="text" class="form-control" id="password2" required>
                <span class="toggle-password" onclick="togglePassword()">
                  <i class="fa fa-eye p-3"  id="eyeIcon"></i>
                </span>
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            <div class="text-center mt-3">
                <a href="guestLogin.html" onclick="showLoginPage()" class="text-decoration-none">Back to Login</a>
            </div>
        </form>
    </div>
</div>



<!-- JavaScript -->
<script>
    function showForgotPassword() {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("forgotPasswordPage").style.display = "block";
    }

    function showLoginPage() {
        document.getElementById("forgotPasswordPage").style.display = "none";
        document.getElementById("resetPasswordPage").style.display = "none";
        document.getElementById("loginPage").style.display = "block";
    }

    function sendVerificationCode() {
        alert("Verification code sent to your email.");
        document.getElementById("forgotPasswordPage").style.display = "none";
        document.getElementById("resetPasswordPage").style.display = "block";
        return false;
    }

    function resetPassword() {
        let newPassword = document.getElementById("newPassword").value;
        let confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
            alert("Passwords do not match!");
            return false;
        }

        alert("Password reset successful! Redirecting to login...");
        showLoginPage();
        return false;
    }

    function togglePassword() {
        let passwordField = document.getElementById("password");
        let eyeIcon = document.getElementById("eyeIcon");
        
        if (passwordField.type === "password") {
            passwordField.type = "text";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        } else {
            passwordField.type = "password";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        }
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
